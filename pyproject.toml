[project]
name = "keyshelf"
version = "0.1.0"
description = "Read-only shelf for downloaded Google / Firebase credential files: what each one is, what it is for, duplicates and copies in repositories"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
keyshelf = "keyshelf.cli:main"

[build-system]
requires = ["uv_build>=0.9,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8"]
